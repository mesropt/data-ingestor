[project]
name = "assayingest"
version = "0.1.0"
description = "AI ingest tool for CRO assay files — Claude maps messy columns to target fields with per-field confidence."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.69",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pydantic>=2.9",
    "defusedxml>=0.7.1",
    "pyyaml>=6.0.3",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",
    "pwdlib[argon2]>=0.3.0",
    "authlib>=1.7.2",
    "python-dotenv>=1.0",
    # Persistence (quick 260712-ghn). Runtime, not dev: `sqlalchemy` and `psycopg`
    # are imported by the shipped package at request time, and `alembic` is read by
    # the app's startup schema check (`api/app.py::_require_schema_at_head`).
    #
    # Note what this does NOT buy: `alembic.ini` and `alembic/versions/` live at the
    # REPO ROOT and the wheel ships only `src/assayingest`, so `alembic upgrade head`
    # works from a checkout, not from a bare `pip install` of this package.
    # Migrations are a repo-level operation.
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "psycopg[binary]>=3.3.4",
]

[project.scripts]
assayingest = "assayingest.cli:main"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assayingest"]

# Presets are plain YAML data (D-20) -- ship them inside the wheel so a
# pip/uv install can load them by path, the same way a checkout can.
[tool.hatch.build.targets.wheel.force-include]
"presets" = "assayingest/presets"

[tool.pytest.ini_options]
testpaths = ["tests"]
