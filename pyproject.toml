[project]
name = "assayingest"
version = "0.1.0"
description = "AI ingest tool for CRO assay files — Claude maps messy columns to target fields with per-field confidence."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.69",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pydantic>=2.9",
    "defusedxml>=0.7.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
assayingest = "assayingest.cli:main"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assayingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
