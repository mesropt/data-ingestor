<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Ingestor</title>
    <script>
      // Apply the persisted theme before first paint (ThemeToggle.tsx owns
      // the same STORAGE_KEY/logic) so a dark-mode reload never flashes light.
      (function () {
        try {
          var stored = window.localStorage.getItem("assayingest-theme");
          document.documentElement.dataset.theme = stored === "dark" ? "dark" : "light";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
