# PostgreSQL 17 -- the project's only persistence backend (quick 260712-ghn, D-1).
#
# No top-level `version:` key: Compose v2+ treats it as obsolete and warns.
#
# The credentials below are dev-only, non-secret literals, committed on purpose so
# `docker compose up -d` and the `.env.example` URLs line up with zero setup. Real
# deployment credentials belong in the environment, never in this file.
services:
  db:
    image: postgres:17
    container_name: data-ingestor-db
    environment:
      POSTGRES_USER: assayingest
      POSTGRES_PASSWORD: assayingest
      POSTGRES_DB: assayingest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The -U/-d flags are load-bearing: a bare `pg_isready` checks the SERVER,
      # which reports ready during initdb -- BEFORE the application database
      # exists. Gating on the real database is what makes "healthy" mean usable.
      test: ["CMD-SHELL", "pg_isready -U assayingest -d assayingest"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  pgdata:
